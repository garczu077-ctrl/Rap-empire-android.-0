
name: Build RAP EMPIRE APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Rozpakowanie gry RAP EMPIRE
        run: |
          unzip -o RAP-EMPIRE-source.zip -d .

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sprawdzenie plikow
        run: |
          test -f www/index.html
          test -f capacitor.config.json
          test -f package.json

      - name: Instalacja zaleznosci
        run: npm install

      - name: Utworzenie platformy Android
        run: npx cap add android

      - name: Synchronizacja gry
        run: npx cap sync android

      - name: Budowanie APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Udostepnienie APK
        uses: actions/upload-artifact@v4
        with:
          name: RAP-EMPIRE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
